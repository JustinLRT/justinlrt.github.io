<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chapter 2 v2.1.1 - Integrated Accounting Fundamentals</title>
<style>
  :root{
    --bg: #fbf7ef;
    --ink: #241a0f;
    --amber: #f2a71b;
    --amber-dark: #d68c0a;
    --dark: #2b1d0e;
    --green: #1f8a4c;
    --green-bg: #e6f6ec;
    --red: #c0392b;
    --red-bg: #fdecea;
    --card: #ffffff;
    --muted: #8a7a63;
    --border: #ece2ce;
  }
  html {
  	margin-bottom: 190px;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    font-family: Georgia, 'Iowan Old Style', serif;
    background: var(--bg);
    color: var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 18px 12px 90px;
  }
  .wrap{ width:100%; max-width: 860px; }
  header.top{
    background: var(--dark);
    color: #fff;
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    top: 8px; z-index: 5;
  }
  header.top h1{
    font-size: 1.0rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 0 0 12px 0;
    font-weight: 700;
    color: var(--amber);
  }
  .stat-row{ display:flex; gap: 10px; flex-wrap: wrap; }
  .stat{ flex: 1 1 0; min-width: 80px; background: rgba(255,255,255,0.06); border-radius: 10px; padding: 8px 10px; text-align:center; }
  .stat .num{ font-size:1.3rem; font-weight:700; font-family: Arial, sans-serif; }
  .stat .label{ font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.07em; color:#cbb98c; margin-top:2px;}
  .stat.correct .num{ color:#6fe3a0; }
  .stat.wrong .num{ color:#ff8f80; }
  .stat.answered .num{ color:#ffd479; }
  .progress-bar{ height:6px; background: rgba(255,255,255,0.15); border-radius: 4px; margin-top:12px; overflow:hidden; }
  .progress-fill{ height:100%; background: var(--amber); transition: width .25s ease; }
  .combined-note{ font-family: Arial, sans-serif; font-size:0.72rem; color:#cbb98c; margin-top:8px; text-align:right;}

  .tabs{ display:flex; gap:8px; margin-bottom: 12px; }
  .tab{
    flex:1; text-align:center; padding: 11px 10px; border-radius: 12px;
    font-family: Arial, sans-serif; font-weight:700; font-size:0.85rem;
    background: #fff; border: 1.5px solid var(--border); cursor:pointer; color: var(--muted);
  }
  .tab.active{ background: var(--dark); color: var(--amber); border-color: var(--dark); }

  .restart-row{ display:flex; justify-content:flex-end; margin-bottom: 10px; }
  .restart-btn{
    font-family: Arial, sans-serif; font-size: 0.78rem; font-weight:700; color: var(--dark);
    background: transparent; border: 1.5px solid var(--dark); border-radius: 999px; padding: 6px 14px; cursor:pointer;
  }
  .restart-btn:hover{ background: var(--dark); color:#fff; }

  .card{ background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 20px 16px; box-shadow: 0 2px 10px rgba(60,40,10,0.06); }
  .qmeta{ display:flex; justify-content:space-between; align-items:center; font-family: Arial, sans-serif; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 10px; }
  .qmeta .pill{ background: var(--amber); color: #2b1d0e; padding: 3px 10px; border-radius: 999px; font-weight: 700; }

  .question-text{ font-size: 1.1rem; line-height: 1.5; margin: 4px 0 18px 0; font-weight: 600; }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{ display:flex; align-items:flex-start; gap: 10px; border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor:pointer; transition: background .15s ease, border-color .15s ease; font-family: Arial, sans-serif; font-size: 0.95rem; line-height: 1.4; }
  .opt:hover{ background: #fff8ea; border-color: var(--amber); }
  .opt .letter{ font-weight:700; color: var(--amber-dark); min-width: 20px; }
  .opt.correct{ background: var(--green-bg); border-color: var(--green); }
  .opt.incorrect{ background: var(--red-bg); border-color: var(--red); }
  .opt.disabled{ cursor:default; }
  .opt.dim{ opacity: 0.55; }

  .result-banner{ margin-top: 10px; font-family: Arial, sans-serif; font-weight: 700; font-size: 0.88rem; padding: 8px 12px; border-radius: 8px; }
  .result-banner.correct{ background: var(--green-bg); color: var(--green); }
  .result-banner.incorrect{ background: var(--red-bg); color: var(--red); }
  .correct-match-line{ font-family: Arial, sans-serif; font-size: 0.82rem; color: var(--muted); margin-top: 6px; }

  .exp-toggle{ margin-top: 10px; background: none; border: 1.5px dashed var(--amber-dark); color: var(--amber-dark); font-family: Arial, sans-serif; font-weight: 700; font-size: 0.8rem; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
  .exp-toggle:hover{ background: #fff8ea; }
  .explanation{ margin-top: 10px; background: #f4ecdb; border-left: 4px solid var(--amber-dark); padding: 10px 12px; border-radius: 8px; font-family: Arial, sans-serif; font-size: 0.87rem; line-height: 1.5; color: #4a3a20; display:none; }
  .explanation.show{ display:block; }

  nav.bottom{ position: fixed; bottom: 0; left:0; right:0; background: var(--dark); padding: 12px 16px; display:flex; justify-content:center; gap: 14px; box-shadow: 0 -4px 14px rgba(0,0,0,0.18); }
  nav.bottom .inner{ width:100%; max-width: 860px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  nav.bottom button{ font-family: Arial, sans-serif; font-weight:700; font-size: 0.9rem; padding: 11px 20px; border-radius: 10px; border:none; cursor:pointer; background: var(--amber); color: var(--dark); flex: 0 0 auto; }
  nav.bottom button:disabled{ opacity:0.35; cursor:not-allowed; }
  nav.bottom .center-label{ color:#e8dcc0; font-family: Arial, sans-serif; font-size: 0.82rem; text-align:center; flex: 1 1 auto; }

  /* --- Folio A list layout --- */
  .list-hint{
    font-family: Arial, sans-serif; font-size: 0.78rem; color: var(--muted);
    margin-bottom: 14px; line-height:1.5;
  }
  .a-row{
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    background: #fffefb;
  }
  .a-row-top{ display:flex; gap: 10px; align-items:flex-start; margin-bottom: 10px; }
  .a-num{
    flex: 0 0 auto;
    background: var(--dark); color: var(--amber);
    font-family: Arial, sans-serif; font-weight:700; font-size: 0.8rem;
    border-radius: 999px; width: 28px; height: 28px;
    display:flex; align-items:center; justify-content:center;
  }
  .a-statement{ font-size: 1.0rem; line-height: 1.5; font-weight: 600; padding-top: 3px; }
  .a-select-row{ display:flex; align-items:center; gap:10px; }
  .a-select-label{ font-family: Arial, sans-serif; font-size: 0.78rem; color: var(--muted); white-space:nowrap; }
  select.a-select{
    flex:1; max-width: 220px; padding: 10px 10px; border-radius: 10px; border: 1.5px solid var(--border);
    font-family: Arial, sans-serif; font-size: 0.92rem; background:#fff;
  }
  select.a-select:disabled{ opacity: 0.85; }
  .a-feedback{ margin-top: 2px; }

  /* --- Interactive legend --- */
  .legend-wrap{ margin-top: 16px; background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; }
  .legend-title{ font-family: Arial, sans-serif; font-weight:700; font-size: 0.85rem; color: var(--dark); margin-bottom: 4px; }
  .legend-sub{ font-family: Arial, sans-serif; font-size: 0.74rem; color: var(--muted); margin-bottom: 12px; line-height:1.5; }
  .legend-grid{
    max-height: 420px; overflow-y: auto;
    display:grid; grid-template-columns: 1fr; gap: 6px;
    font-family: Arial, sans-serif; font-size: 0.83rem;
  }
  @media (min-width: 620px){ .legend-grid{ grid-template-columns: 1fr 1fr; } }
  .legend-item{
    display:flex; gap:8px; align-items:baseline; padding: 7px 9px; border-radius: 8px; background: #fbf7ef;
    cursor:pointer; user-select:none; transition: background .12s ease, opacity .12s ease;
    border: 1.5px solid transparent;
  }
  .legend-item:hover{ border-color: var(--amber); }
  .legend-item b{ color: var(--amber-dark); min-width: 34px; }
  .legend-item.eliminated{ opacity: 0.4; background:#efe8da; }
  .legend-item.eliminated span.txt{ text-decoration: line-through; }
  .legend-item.autoused b{ color: var(--green); }
  .legend-item .used-tag{ margin-left:auto; font-size:0.68rem; color: var(--green); font-weight:700; }
</style>
</head>

/* ============================================================
   HELPERS
============================================================ */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function genLetterCodes(){
  const codes = [];
  for(let i=0;i<26;i++) codes.push(String.fromCharCode(65+i));
  for(let i=0;i<26;i++){ const c = String.fromCharCode(65+i); codes.push(c+c); }
  ["AAA","BBB","CCC","DDD","EEE","FFF"].forEach(t=>codes.push(t));
  return codes; // length 58
}

/* ============================================================
   STATE
============================================================ */
let folioA = { items: [], legend: [], eliminated: new Set() };
let folioB = { items: [], current: 0 };
let activeFolio = 'A';

function buildFolioA(){
  const allTexts = shuffle(FOLIO_A_RAW.map(r=>r.term).concat(FOLIO_A_DISTRACTORS));
  const codes = genLetterCodes();
  const textToLetter = {};
  const legend = codes.map((code, i) => {
    textToLetter[allTexts[i]] = code;
    return { code, text: allTexts[i] };
  });

  const orderedItems = shuffle(FOLIO_A_RAW.map(r => ({
    statement: r.statement,
    term: r.term,
    exp: r.exp,
    correctLetter: textToLetter[r.term],
    selected: null,
    answered: false,
    showExp: false
  })));

  folioA = { items: orderedItems, legend, eliminated: new Set() };
}

function buildFolioB(){
  const items = shuffle(FOLIO_B_RAW).map(raw => {
    const idxOrder = shuffle(raw.options.map((o,i)=>i));
    const newOptions = idxOrder.map(i=>raw.options[i]);
    const newCorrect = idxOrder.indexOf(raw.correct);
    return {
      q: raw.q,
      options: newOptions,
      correct: newCorrect,
      exp: raw.exp,
      selected: null,
      answered: false
    };
  });
  folioB = { items, current: 0 };
}

function buildAll(){
  buildFolioA();
  buildFolioB();
}
buildAll();

/* ============================================================
   STATS
============================================================ */
function folioStats(folio, isA){
  let correct=0, wrong=0, answered=0;
  const total = folio.items.length;
  folio.items.forEach(it=>{
    if(it.answered){
      answered++;
      const isCorrect = isA ? (it.selected === it.correctLetter) : (it.selected === it.correct);
      if(isCorrect) correct++; else wrong++;
    }
  });
  return { correct, wrong, answered, total };
}

function updateHeader(){
  const isA = activeFolio === 'A';
  const folio = isA ? folioA : folioB;
  const st = folioStats(folio, isA);
  document.getElementById('headerTitle').textContent = isA ? 'Folio A — Matching Type' : 'Folio B — Multiple Choice';
  document.getElementById('statCorrect').textContent = st.correct;
  document.getElementById('statWrong').textContent = st.wrong;
  document.getElementById('statAnswered').textContent = st.answered + '/' + st.total;
  const pct = st.total ? Math.round((st.answered/st.total)*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';

  const stA = folioStats(folioA, true);
  const stB = folioStats(folioB, false);
  document.getElementById('combinedNote').textContent =
    'Combined total: ' + (stA.answered+stB.answered) + '/100 answered · ' +
    (stA.correct+stB.correct) + ' correct · ' + (stA.wrong+stB.wrong) + ' wrong';
}

/* ============================================================
   RENDER — FOLIO A (full list, not slides)
============================================================ */
function renderFolioA(){
  document.getElementById('bottomNav').style.display = 'none';
  const card = document.getElementById('cardArea');
  card.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'card';

  const hint = document.createElement('div');
  hint.className = 'list-hint';
  hint.textContent = "All 50 items are listed below for easy scanning — pick a letter for each from the dropdown. Use the choice bank underneath to cross off letters you've already used or ruled out.";
  wrap.appendChild(hint);

  folioA.items.forEach((it, idx) => {
    const row = document.createElement('div');
    row.className = 'a-row';
    row.id = 'a-row-' + idx;

    const top = document.createElement('div');
    top.className = 'a-row-top';
    const num = document.createElement('div');
    num.className = 'a-num';
    num.textContent = (idx+1);
    const stmt = document.createElement('div');
    stmt.className = 'a-statement';
    stmt.textContent = it.statement;
    top.appendChild(num);
    top.appendChild(stmt);
    row.appendChild(top);

    const selRow = document.createElement('div');
    selRow.className = 'a-select-row';
    const label = document.createElement('div');
    label.className = 'a-select-label';
    label.textContent = 'Answer:';
    const select = document.createElement('select');
    select.className = 'a-select';
    select.disabled = it.answered;

    const blank = document.createElement('option');
    blank.value = '';
    blank.textContent = '— choose —';
    select.appendChild(blank);
    folioA.legend.forEach(entry => {
      const o = document.createElement('option');
      o.value = entry.code;
      o.textContent = entry.code;
      if(it.selected === entry.code) o.selected = true;
      select.appendChild(o);
    });

    select.addEventListener('change', (e) => {
      if(!e.target.value) return;
      it.selected = e.target.value;
      it.answered = true;
      refreshRowFeedback(idx);
      select.disabled = true;
      updateHeader();
      renderLegend();
    });

    selRow.appendChild(label);
    selRow.appendChild(select);
    row.appendChild(selRow);

    const feedback = document.createElement('div');
    feedback.className = 'a-feedback';
    feedback.id = 'a-feedback-' + idx;
    row.appendChild(feedback);

    wrap.appendChild(row);
  });

  card.appendChild(wrap);

  folioA.items.forEach((it, idx) => { if(it.answered) refreshRowFeedback(idx); });

  renderLegend();
}

function refreshRowFeedback(idx){
  const it = folioA.items[idx];
  const feedback = document.getElementById('a-feedback-' + idx);
  if(!feedback) return;
  feedback.innerHTML = '';
  if(!it.answered) return;

  const isCorrect = it.selected === it.correctLetter;
  const banner = document.createElement('div');
  banner.className = 'result-banner ' + (isCorrect ? 'correct' : 'incorrect');
  banner.textContent = isCorrect ? '✓ Correct!' : '✗ Incorrect.';
  feedback.appendChild(banner);

  const correctLine = document.createElement('div');
  correctLine.className = 'correct-match-line';
  correctLine.textContent = 'Correct match: ' + it.correctLetter + ' — ' + it.term;
  feedback.appendChild(correctLine);

  const toggle = document.createElement('button');
  toggle.className = 'exp-toggle';
  toggle.textContent = it.showExp ? 'Hide Explanation' : 'Add Explanation';
  const expEl = document.createElement('div');
  expEl.className = 'explanation' + (it.showExp ? ' show' : '');
  expEl.textContent = it.exp;

  toggle.addEventListener('click', () => {
    it.showExp = !it.showExp;
    refreshRowFeedback(idx);
  });

  feedback.appendChild(toggle);
  feedback.appendChild(expEl);
}

function renderLegend(){
  const legendArea = document.getElementById('legendArea');
  if(activeFolio !== 'A'){ legendArea.innerHTML = ''; return; }
  legendArea.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'legend-wrap';
  wrap.innerHTML =
    '<div class="legend-title">Full Choice Bank (A – FFF)</div>' +
    '<div class="legend-sub">58 lettered choices for 50 items. Click a letter to cross it off once you\'ve used it or ruled it out — this is just a scratchpad and doesn\'t change your answers.</div>';
  const grid = document.createElement('div');
  grid.className = 'legend-grid';

  folioA.legend.forEach(entry=>{
    const isAutoUsed = folioA.items.some(it => it.selected === entry.code);
    const isManual = folioA.eliminated.has(entry.code);
    const item = document.createElement('div');
    item.className = 'legend-item' + ((isAutoUsed || isManual) ? ' eliminated' : '') + (isAutoUsed ? ' autoused' : '');
    item.innerHTML = '<b>' + entry.code + '.</b><span class="txt">' + entry.text + '</span>' + (isAutoUsed ? '<span class="used-tag">used</span>' : '');
    item.addEventListener('click', () => {
      if(folioA.eliminated.has(entry.code)) folioA.eliminated.delete(entry.code);
      else folioA.eliminated.add(entry.code);
      renderLegend();
    });
    grid.appendChild(item);
  });

  wrap.appendChild(grid);
  legendArea.appendChild(wrap);
}

/* ============================================================
   RENDER — FOLIO B (MCQ, slide form)
============================================================ */
function renderFolioB(){
  document.getElementById('bottomNav').style.display = 'flex';
  document.getElementById('legendArea').innerHTML = '';
  const card = document.getElementById('cardArea');
  card.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'card';
  const it = folioB.items[folioB.current];

  const meta = document.createElement('div');
  meta.className = 'qmeta';
  meta.innerHTML = '<span>Multiple Choice</span><span class="pill">Item ' + (folioB.current+1) + ' / ' + folioB.items.length + '</span>';
  wrap.appendChild(meta);

  const qEl = document.createElement('div');
  qEl.className = 'question-text';
  qEl.textContent = it.q;
  wrap.appendChild(qEl);

  const optsWrap = document.createElement('div');
  optsWrap.className = 'options';
  const letters = ['A','B','C','D'];

  it.options.forEach((opt, i) => {
    const row = document.createElement('div');
    row.className = 'opt';
    row.innerHTML = '<span class="letter">' + letters[i] + '.</span><span>' + opt + '</span>';
    if(it.answered){
      row.classList.add('disabled');
      if(i === it.correct) row.classList.add('correct');
      else if(i === it.selected) row.classList.add('incorrect');
      else row.classList.add('dim');
    } else {
      row.addEventListener('click', () => {
        it.answered = true;
        it.selected = i;
        render();
      });
    }
    optsWrap.appendChild(row);
  });
  wrap.appendChild(optsWrap);

  if(it.answered){
    const isCorrect = it.selected === it.correct;
    const banner = document.createElement('div');
    banner.className = 'result-banner ' + (isCorrect ? 'correct' : 'incorrect');
    banner.textContent = isCorrect ? '✓ Correct!' : '✗ Incorrect — the correct answer is highlighted above.';
    wrap.appendChild(banner);

    appendExplanation(wrap, it.exp);
  }

  card.appendChild(wrap);
}

function appendExplanation(card, expText){
  const toggle = document.createElement('button');
  toggle.className = 'exp-toggle';
  toggle.textContent = 'Add Explanation';
  const expEl = document.createElement('div');
  expEl.className = 'explanation';
  expEl.textContent = expText;
  let shown = false;
  toggle.addEventListener('click', () => {
    shown = !shown;
    expEl.classList.toggle('show', shown);
    toggle.textContent = shown ? 'Hide Explanation' : 'Add Explanation';
  });
  card.appendChild(toggle);
  card.appendChild(expEl);
}

/* ============================================================
   MAIN RENDER + NAV
============================================================ */
function render(){
  if(activeFolio === 'A') renderFolioA(); else renderFolioB();
  updateHeader();
  updateNav();
}

function updateNav(){
  if(activeFolio === 'A') return;
  document.getElementById('prevBtn').disabled = folioB.current === 0;
  document.getElementById('nextBtn').disabled = folioB.current === folioB.items.length - 1;
  document.getElementById('slideLabel').textContent = 'Item ' + (folioB.current+1) + ' / ' + folioB.items.length;
}

document.getElementById('prevBtn').addEventListener('click', () => {
  if(activeFolio === 'B' && folioB.current > 0){ folioB.current--; render(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if(activeFolio === 'B' && folioB.current < folioB.items.length-1){ folioB.current++; render(); }
});

document.getElementById('tabA').addEventListener('click', () => {
  activeFolio = 'A';
  document.getElementById('tabA').classList.add('active');
  document.getElementById('tabB').classList.remove('active');
  render();
});
document.getElementById('tabB').addEventListener('click', () => {
  activeFolio = 'B';
  document.getElementById('tabB').classList.add('active');
  document.getElementById('tabA').classList.remove('active');
  render();
});

document.getElementById('restartBtn').addEventListener('click', () => {
  buildAll();
  render();
});

render();
</script>
