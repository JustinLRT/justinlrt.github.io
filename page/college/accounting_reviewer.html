<!DOCTYPE html>
<html lang="en">
<head>

<title>Chapter 2: Integrated Accounting Fundamentals — Reviewer</title>
<style>
  :root{
    --bg: #fbf7ef;
    --ink: #241a0f;
    --amber: #f2a71b;
    --amber-dark: #d68c0a;
    --dark: #2b1d0e;
    --green: #1f8a4c;
    --green-bg: #e6f6ec;
    --red: #c0392b;
    --red-bg: #fdecea;
    --card: #ffffff;
    --muted: #8a7a63;
    --border: #ece2ce;
  }
  * { box-sizing: border-box; }
  html {
  	margin-bottom: 170px;
  }
  body{
    margin:0;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background: var(--bg);
    color: var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 18px 12px 90px;
  }
  .wrap{ width:100%; max-width: 760px; }
  header.top{
    background: var(--dark);
    color: #fff;
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  header.top h1{
    font-size: 1.05rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 12px 0;
    font-weight: 700;
    color: var(--amber);
  }
  .stat-row{
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .stat{
    flex: 1 1 0;
    min-width: 80px;
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 8px 10px;
    text-align:center;
  }
  .stat .num{ font-size:1.35rem; font-weight:700; font-family: Arial, sans-serif; }
  .stat .label{ font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em; color:#cbb98c; margin-top:2px;}
  .stat.correct .num{ color:#6fe3a0; }
  .stat.wrong .num{ color:#ff8f80; }
  .stat.answered .num{ color:#ffd479; }
  .progress-bar{
    height:6px; background: rgba(255,255,255,0.15); border-radius: 4px; margin-top:12px; overflow:hidden;
  }
  .progress-fill{ height:100%; background: var(--amber); transition: width .25s ease; }

  .card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 20px 16px;
    box-shadow: 0 2px 10px rgba(60,40,10,0.06);
  }
  .qmeta{
    display:flex; justify-content:space-between; align-items:center;
    font-family: Arial, sans-serif;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .qmeta .pill{
    background: var(--amber);
    color: #2b1d0e;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 700;
  }
  .question-text{
    font-size: 1.15rem;
    line-height: 1.5;
    margin: 4px 0 18px 0;
    font-weight: 600;
  }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    display:flex;
    align-items:flex-start;
    gap: 10px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    cursor:pointer;
    transition: background .15s ease, border-color .15s ease;
    font-family: Arial, sans-serif;
    font-size: 0.96rem;
    line-height: 1.4;
  }
  .opt:hover{ background: #fff8ea; border-color: var(--amber); }
  .opt .letter{
    font-weight:700; color: var(--amber-dark);
    min-width: 20px;
  }
  .opt.correct{ background: var(--green-bg); border-color: var(--green); }
  .opt.incorrect{ background: var(--red-bg); border-color: var(--red); }
  .opt.disabled{ cursor:default; }
  .opt.dim{ opacity: 0.55; }

  .result-banner{
    margin-top: 14px;
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 10px 14px;
    border-radius: 10px;
  }
  .result-banner.correct{ background: var(--green-bg); color: var(--green); }
  .result-banner.incorrect{ background: var(--red-bg); color: var(--red); }

  .match-list{ display:flex; flex-direction:column; gap:10px; }
  .match-row{
    display:flex; align-items:center; gap:12px;
    font-family: Arial, sans-serif;
    font-size: 0.92rem;
  }
  .match-term{
    flex: 0 0 40%;
    font-weight:700;
    background:#fff8ea;
    border:1.5px solid var(--border);
    border-radius:10px;
    padding: 10px 12px;
  }
  select.match-select{
    flex:1;
    padding: 10px 10px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    font-family: Arial, sans-serif;
    font-size: 0.9rem;
    background:#fff;
    width: 100%;
  }
  .match-row.correct select{ border-color: var(--green); background: var(--green-bg); }
  .match-row.incorrect select{ border-color: var(--red); background: var(--red-bg); }
  .match-row .mark{ width:22px; text-align:center; font-weight:700; }
  .match-row.correct .mark{ color: var(--green); }
  .match-row.incorrect .mark{ color: var(--red); }

  button.submit-btn{
    margin-top: 16px;
    background: var(--amber);
    color: var(--dark);
    border:none;
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: 0.92rem;
    padding: 11px 18px;
    border-radius: 10px;
    cursor:pointer;
  }
  button.submit-btn:hover{ background: var(--amber-dark); color:#fff; }
  button.submit-btn:disabled{ opacity:0.45; cursor:not-allowed; }
  a {
  	color: #f2a71b;
  }
  .exp-toggle{
    margin-top: 14px;
    background: none;
    border: 1.5px dashed var(--amber-dark);
    color: var(--amber-dark);
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 9px 14px;
    border-radius: 10px;
    cursor: pointer;
  }
  .exp-toggle:hover{ background: #fff8ea; }
  .explanation{
    margin-top: 12px;
    background: #f4ecdb;
    border-left: 4px solid var(--amber-dark);
    padding: 12px 14px;
    border-radius: 8px;
    font-family: Arial, sans-serif;
    font-size: 0.9rem;
    line-height: 1.55;
    color: #4a3a20;
    display:none;
  }
  .explanation.show{ display:block; }

  nav.bottom{
    position: fixed;
    bottom: 0; left:0; right:0;
    background: var(--dark);
    padding: 12px 16px;
    display:flex;
    justify-content:center;
    gap: 14px;
    box-shadow: 0 -4px 14px rgba(0,0,0,0.18);
  }
  nav.bottom .inner{
    width:100%; max-width: 760px;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  nav.bottom button{
    font-family: Arial, sans-serif;
    font-weight:700;
    font-size: 0.9rem;
    padding: 11px 20px;
    border-radius: 10px;
    border:none;
    cursor:pointer;
    background: var(--amber);
    color: var(--dark);
    flex: 0 0 auto;
  }
  nav.bottom button:disabled{ opacity:0.35; cursor:not-allowed; }
  nav.bottom .center-label{
    color:#e8dcc0;
    font-family: Arial, sans-serif;
    font-size: 0.82rem;
    text-align:center;
    flex: 1 1 auto;
  }
  .restart-row{
    display:flex; justify-content:flex-end; margin-bottom: 10px;
  }
  .restart-btn{
    font-family: Arial, sans-serif;
    font-size: 0.78rem;
    font-weight:700;
    color: var(--dark);
    background: transparent;
    border: 1.5px solid var(--dark);
    border-radius: 999px;
    padding: 6px 14px;
    cursor:pointer;
  }
  .restart-btn:hover{ background: var(--dark); color:#fff; }
  .match-title{ font-size:0.8rem; color:var(--muted); font-family:Arial, sans-serif; margin-bottom:14px; }
</style>
</head>

<script>
/* ---------------------------------------------------------
   CONTENT: 70 multiple-choice items + 6 matching sets (5 pairs each) = 100 items
--------------------------------------------------------- */
const MCQ = [
{q:"Which term best describes accounting as a whole system?",options:["A system that only stores tax records","An information and measurement system that identifies, records, and communicates business activity","A method used only by banks","A legal requirement with no analytical purpose"],correct:1,exp:"Accounting identifies, records, and communicates relevant, reliable, and comparable information about a business's activities."},
{q:"What is an Accounting Information System?",options:["A spreadsheet template","The means by which an entity records, stores, and retrieves financial and managerial information for reporting","A government portal for filing taxes","A marketing analytics tool"],correct:1,exp:"It is the means by which a reporting entity records and stores information from transactions so it can later retrieve and report it."},
{q:"Double-entry bookkeeping views each transaction as having:",options:["No effect on accounts","A single effect only","A two-fold effect — value received and value parted with","Three simultaneous effects"],correct:2,exp:"Double-entry bookkeeping reflects both a value received and a value parted with for every transaction."},
{q:"Single-entry accounting is typically adopted by:",options:["Multinational corporations only","Organizations with few, simple transactions, such as small businesses and practicing professionals","Publicly listed companies","Government agencies exclusively"],correct:1,exp:"Single-entry bookkeeping suits small enterprises or professionals with relatively few and simple transactions."},
{q:"Which books of account are typically used under single-entry accounting?",options:["General ledger and subsidiary ledger only","Day book/General journal, and cash book with subsidiary ledgers","Worksheet and adjusted trial balance","Financial statements only"],correct:1,exp:"Single-entry systems commonly rely on a day book (general journal) plus a cash book and subsidiary ledgers."},
{q:"Bookkeeping is best defined as:",options:["The analysis phase of accounting","The systematic and chronological recording of transactions and events — the recording phase of accounting","The preparation of tax returns","The auditing of financial statements"],correct:1,exp:"Bookkeeping is the recording phase of accounting, done systematically and chronologically."},
{q:"In double-entry bookkeeping, the 'Concept of Duality' refers to:",options:["Recording a transaction twice by mistake","Every transaction having two-fold effects reflected in the records","Only large transactions needing two approvals","Using two different journals for one entry"],correct:1,exp:"Duality means every transaction has a two-fold effect (value received and value parted with)."},
{q:"The 'Concept of Equilibrium' in double-entry bookkeeping means:",options:["Debits and credits eventually go out of balance","The two-fold effects of a transaction keep the accounting equation in balance","Only equity accounts must balance","Balancing is optional if amounts are small"],correct:1,exp:"Equilibrium reflects that the dual effects of transactions keep total debits equal to total credits."},
{q:"An 'account' in accounting is best described as:",options:["A physical folder of receipts","The basic storage of information recording increases and decreases in a specific asset, liability, equity, income, or expense item","A bank account only","A tax identification record"],correct:1,exp:"An account is the basic unit that stores the increases and decreases of a specific financial statement item."},
{q:"A chart of accounts is:",options:["A pie chart of expenses","A list of all the accounts used by a business","A graph of net income over time","A single ledger page"],correct:1,exp:"The chart of accounts lists every account a business uses in its books."},
{q:"Contra accounts are presented in the financial statements as:",options:["An addition to their related account","A deduction to their related account","A completely separate statement","Notes to financial statements only"],correct:1,exp:"Contra accounts reduce (are deducted from) their related account in the financial statements."},
{q:"Adjunct accounts are presented in the financial statements as:",options:["A deduction to their related account","An addition to their related account","Off-balance-sheet items only","Suspense entries"],correct:1,exp:"Adjunct accounts add to the balance of their related account."},
{q:"A suspense account is used when:",options:["A transaction is fraudulent","The appropriate general ledger account could not be determined at the time the transaction was recorded","The company wants to hide losses","Cash is physically missing"],correct:1,exp:"A suspense account temporarily holds amounts when the correct account can't yet be identified."},
{q:"Real (permanent) accounts are characterized by:",options:["Zeroing out at the end of every period","Having running balances that continually accumulate across periods","Only being used for income and expenses","Never appearing on the balance sheet"],correct:1,exp:"Real/permanent accounts carry running balances forward from period to period."},
{q:"Nominal (temporary) accounts are characterized by:",options:["Running balances that accumulate forever","Balances that zero out at the end of each accounting period","Being reported only in the notes","Applying only to liabilities"],correct:1,exp:"Nominal/temporary accounts (like income and expenses) are closed to zero at period end."},
{q:"Which of the following is the correct definition of an asset?",options:["A present obligation to transfer resources","A present economic resource controlled by the entity as a result of past events, with potential to produce economic benefits","Assets minus liabilities","An increase in equity from owner investment"],correct:1,exp:"An asset is a present economic resource controlled by the entity from past events with potential future economic benefit."},
{q:"Which of the following is the correct definition of a liability?",options:["A present obligation of the entity to transfer an economic resource as a result of past events","A resource that produces future benefits","The residual interest after deducting liabilities","An inflow that increases equity"],correct:0,exp:"A liability is a present obligation to transfer an economic resource arising from past events."},
{q:"Equity is defined as:",options:["Assets plus liabilities","Liabilities minus assets","Assets minus liabilities","Total income for the period"],correct:2,exp:"Equity equals assets minus liabilities."},
{q:"Income is best defined as:",options:["Decreases in economic benefits from asset outflows","Increases in economic benefits during the period other than those from owner investments","Contributions by the business owners","A liability account"],correct:1,exp:"Income refers to increases in economic benefits (inflows/enhancements of assets or decreases of liabilities) other than owner investments."},
{q:"Expenses are best defined as:",options:["Increases in economic benefits from sales","Decreases in economic benefits during the period, other than distributions to owners","Contributions by owners to the business","Assets minus liabilities"],correct:1,exp:"Expenses are decreases in economic benefits (outflows/depletions of assets or increases in liabilities) other than distributions to owners."},
{q:"The basic accounting equation is:",options:["Assets = Liabilities − Capital","Assets = Liabilities + Capital","Capital = Assets + Liabilities","Liabilities = Assets + Capital"],correct:1,exp:"The fundamental accounting equation is Assets = Liabilities + Capital."},
{q:"Rearranging the accounting equation, Capital equals:",options:["Assets + Liabilities","Liabilities − Assets","Assets − Liabilities","Assets × Liabilities"],correct:2,exp:"Since Assets = Liabilities + Capital, then Capital = Assets − Liabilities."},
{q:"Rearranging the accounting equation, Liabilities equals:",options:["Assets − Capital","Assets + Capital","Capital − Assets","Capital ÷ Assets"],correct:0,exp:"Since Assets = Liabilities + Capital, then Liabilities = Assets − Capital."},
{q:"In a sole proprietorship's capital presentation, which item is subtracted in arriving at Ending Capital?",options:["Beginning Capital","Withdrawal","Net Income","Assets"],correct:1,exp:"The capital roll-forward is: Beginning Capital, less Withdrawal, plus/minus Net Income/Loss, equals Ending Capital."},
{q:"In the capital presentation formula, what comes after Beginning Capital and Withdrawal?",options:["Total Liabilities","Net Income or Loss","Total Assets","Accounts Receivable"],correct:1,exp:"The formula flows: Beg. Capital, Withdrawal, Net Income/Loss, then Ending Capital."},
{q:"In a partnership, capital/equity is presented:",options:["As a single combined figure with no partner detail","Separately for each partner (e.g., Partner A, Partner B)","Only as retained earnings","As common stock and preferred stock"],correct:1,exp:"Partnership equity is broken down by individual partner capital accounts."},
{q:"Which of the following is part of a corporation's stockholders' equity section?",options:["Withdrawal account","Common Stock and Retained Earnings","Day book","Suspense account"],correct:1,exp:"Corporate equity includes accounts like Common Stock, Preferred Stock, Share Premium (APIC), and Retained Earnings (Deficit)."},
{q:"In the corporation equity presentation, APIC stands for additional amounts received in excess of par for which two share types?",options:["Common Stock and Preferred Stock","Common Stock and Retained Earnings","Preferred Stock and Notes Payable","Retained Earnings and Deficit"],correct:0,exp:"Share Premium/APIC is presented separately for Common Stock (CS) and Preferred Stock (PS)."},
{q:"In the expanded accounting equation example, which items make up the Assets side?",options:["Accounts Payable and Notes Payable","Cash, Accounts Receivable, Inventory, and Property, Plant & Equipment","Capital, Withdrawals, Income, and Expenses","Common Stock and Preferred Stock"],correct:1,exp:"The Assets side of the expanded equation example includes Cash + Accounts Receivable + Inventory + PPE."},
{q:"In the expanded accounting equation example, which items make up the Liabilities side?",options:["Cash and Inventory","Accounts Payable and Notes Payable","Capital and Withdrawals","Income and Expenses"],correct:1,exp:"Liabilities in the expanded example are represented by Accounts Payable + Notes Payable."},
{q:"In the expanded accounting equation, the Capital side is composed of:",options:["Cash + Accounts Receivable","Capital − Withdrawals + Income − Expenses","Accounts Payable + Notes Payable","Assets − Liabilities only"],correct:1,exp:"The expanded equation's Capital component is Capital − Withdrawals + Income − Expenses."},
{q:"The journal is also known as the:",options:["Book of final entries","Book of original entries","Trial balance","Worksheet"],correct:1,exp:"The journal is called the 'book of original entries' because transactions are first recorded there."},
{q:"Transactions that cannot be recorded in special journals are recorded in the:",options:["General journal","Cash book only","Subsidiary ledger","Statement of accounts"],correct:0,exp:"All transactions not suited to a special journal go into the general journal."},
{q:"A special journal is used to record:",options:["Only year-end adjustments","Transactions with similar nature, such as sales or cash receipts","Only errors found during audits","Reversing entries exclusively"],correct:1,exp:"Special journals group transactions of a similar nature, such as sales, purchases, cash receipts, and cash disbursements."},
{q:"Which of the following is NOT typically one of the four common types of special journals?",options:["Sales journal","Purchases journal","Cash receipts journal","Adjusting entries journal"],correct:3,exp:"The typical special journals are Sales, Purchases, Cash Receipts, and Cash (Disbursements/Payments) journals — not an 'adjusting entries journal.'"},
{q:"In the general journal format, the Date column serves to:",options:["List account numbers","Indicate the recording dates, with transactions arranged chronologically","Show the amount debited","Provide a description of accounts"],correct:1,exp:"The date column shows when transactions occurred, recorded in chronological order."},
{q:"In the general journal, the Account Titles column is used to:",options:["List the accounts affected by a transaction","Record only the transaction date","Show the ledger account number only","List the source document number"],correct:0,exp:"This column records the names of the accounts affected by the business transaction."},
{q:"In the general journal, the Debit and Credit columns record:",options:["The chart of account numbers","The monetary effects of the transaction on the accounts","A narrative description only","The signature of the preparer"],correct:1,exp:"These columns capture the peso (or dollar) amounts debited and credited for the transaction."},
{q:"The ledger is also known as the:",options:["Book of original entries","Book of final entries","Source document register","Worksheet"],correct:1,exp:"The ledger, where account balances are classified and accumulated, is called the 'book of final entries.'"},
{q:"The general ledger contains:",options:["Only cash transactions","All the accounts appearing in the trial balance","Only customer subsidiary accounts","Only supplier subsidiary accounts"],correct:1,exp:"The general ledger holds all accounts that appear in the trial balance."},
{q:"A subsidiary ledger is used to:",options:["Replace the general ledger entirely","Provide a breakdown of the balances of controlling accounts","Record only cash disbursements","Summarize net income for the period"],correct:1,exp:"Subsidiary ledgers break down (detail) the balance of a controlling account, such as Accounts Receivable by customer."},
{q:"In the subsidiary ledger example, the total of individual customer balances should equal:",options:["Zero at all times","The balance of the related control account in the general ledger (e.g., Accounts Receivable)","The total of the cash account","The total liabilities of the business"],correct:1,exp:"Subsidiary ledger balances, when summed, must reconcile to their controlling account in the general ledger."},
{q:"The Latin words 'debere' and 'credere' used in Pacioli's Summa mean, respectively:",options:["To owe and to entrust","To subtract and to add","To increase and to decrease","To open and to close"],correct:0,exp:"Debere means 'to owe,' and credere means 'to entrust' — the origins of debit and credit."},
{q:"The term 'debit' literally means:",options:["Right","Left","Increase","Decrease"],correct:1,exp:"Debit means 'left,' and credit means 'right' — referring to sides of an account."},
{q:"The term 'credit' literally means:",options:["Left","Right","Total","Balance"],correct:1,exp:"Credit means 'right' as opposed to debit, which means 'left.'"},
{q:"What is the normal balance of an Asset account?",options:["Credit","Debit","Zero","Either debit or credit equally"],correct:1,exp:"Assets normally carry a debit balance."},
{q:"What is the normal balance of a Liability account?",options:["Debit","Credit","Zero","Neutral"],correct:1,exp:"Liabilities normally carry a credit balance."},
{q:"What is the normal balance of an Equity account?",options:["Debit","Credit","No balance","Both equally"],correct:1,exp:"Equity accounts normally carry a credit balance."},
{q:"What is the normal balance of an Income account?",options:["Debit","Credit","Zero","Depends on the industry"],correct:1,exp:"Income accounts normally carry a credit balance."},
{q:"What is the normal balance of an Expense account?",options:["Credit","Debit","Zero","Both equally"],correct:1,exp:"Expense accounts normally carry a debit balance."},
{q:"A debit to an Asset account will:",options:["Decrease it","Increase it","Have no effect","Close it to zero"],correct:1,exp:"Debits increase asset accounts, consistent with their normal debit balance."},
{q:"A credit to an Asset account will:",options:["Increase it","Decrease it","Double it","Have no effect"],correct:1,exp:"Credits decrease asset accounts since their normal balance is debit."},
{q:"A debit to a Liability account will:",options:["Increase it","Decrease it","Have no effect","Double it"],correct:1,exp:"Debits decrease liability accounts since their normal balance is credit."},
{q:"A credit to a Liability account will:",options:["Decrease it","Increase it","Have no effect","Zero it out immediately"],correct:1,exp:"Credits increase liability accounts, consistent with their normal credit balance."},
{q:"A debit to an Equity account will:",options:["Increase it","Decrease it","Have no effect","Only apply to corporations"],correct:1,exp:"Debits decrease equity accounts since equity's normal balance is credit."},
{q:"A credit to an Income account will:",options:["Decrease it","Increase it","Have no effect","Close the account immediately"],correct:1,exp:"Credits increase income accounts, consistent with income's normal credit balance."},
{q:"A debit to an Expense account will:",options:["Decrease it","Increase it","Have no effect","Convert it to a liability"],correct:1,exp:"Debits increase expense accounts since expenses normally carry a debit balance."},
{q:"Which grouping correctly represents the debit side of the equation Assets + Expenses = Liabilities + Equity + Income?",options:["Liabilities + Equity","Assets + Expenses","Income only","Equity only"],correct:1,exp:"Assets and Expenses are the accounts with normal debit balances on one side of the expanded equation."},
{q:"The accounting cycle is best described as:",options:["A single-step process done once a year","A multistep process used to create an accurate record of a company's financial position summarized in the financial statements","A process exclusive to auditors","A method for filing taxes only"],correct:1,exp:"The accounting cycle is the multistep process businesses follow to accurately record and report financial position."},
{q:"What is the first step in the accounting cycle?",options:["Journalizing","Identifying and analyzing transactions","Posting to the ledger","Preparing financial statements"],correct:1,exp:"The cycle begins with identifying and analyzing transactions before they are recorded."},
{q:"What is the second step in the accounting cycle?",options:["Posting","Journalizing","Preparing worksheet","Closing entries"],correct:1,exp:"After analysis, transactions are journalized (recorded in the journal)."},
{q:"What is the third step in the accounting cycle?",options:["Posting to the ledger","Preparing the unadjusted trial balance","Making adjusting entries","Reversing entries"],correct:0,exp:"After journalizing, entries are posted to the ledger accounts."},
{q:"What step follows posting in the accounting cycle?",options:["Preparation of the unadjusted trial balance","Closing entries","Reversing entries","Financial statements"],correct:0,exp:"After posting, an unadjusted trial balance is prepared to check that debits equal credits."},
{q:"Which step comes after the unadjusted trial balance?",options:["Preparation of the worksheet","Post-closing trial balance","Reversing entries","Closing entries"],correct:0,exp:"A worksheet is often prepared next to organize account balances and proposed adjustments."},
{q:"Adjusting journal entries occur at which point in the accounting cycle?",options:["Before identifying transactions","After the worksheet, before the adjusted trial balance","After closing entries","After reversing entries"],correct:1,exp:"Adjusting entries are made after the worksheet and before preparing the adjusted trial balance."},
{q:"What immediately follows adjusting entries in the accounting cycle?",options:["Preparing the adjusted trial balance","Identifying transactions","Reversing entries","Post-closing trial balance"],correct:0,exp:"After adjustments are journalized and posted, an adjusted trial balance is prepared."},
{q:"Financial statements are generated at which stage of the accounting cycle?",options:["Right after identifying transactions","After the adjusted trial balance is prepared","Before journalizing","Before posting"],correct:1,exp:"Financial statements are generated using the balances from the adjusted trial balance."},

{q:"Source documents are important primarily because they:",options:["Are required for marketing purposes only","Prove a transaction occurred and serve as evidence of its details","Replace the need for a general ledger","Are only used by auditors"],correct:1,exp:"Source documents prove that a transaction occurred and provide evidence of its details in case of dispute."},

];

  pairs:[
    {term:"Assets", def:"A present economic resource controlled by the entity as a result of past events"},
    {term:"Liabilities", def:"A present obligation of the entity to transfer an economic resource as a result of past events"},
    {term:"Equity", def:"Assets minus liabilities"},
    {term:"Income", def:"Increases in economic benefits other than those from investments by owners"},
    {term:"Expenses", def:"Decreases in economic benefits other than those relating to distributions to owners"},
  ],
  exp:"These are the five major elements of the financial statements as defined under the Conceptual Framework."
},
{
  title:"Match each book/record concept to its correct description.",
  pairs:[
    {term:"Journal", def:"The book of original entries where transactions are first recorded"},
    {term:"Ledger", def:"The book of final entries used to classify effects of transactions on accounts"},
    {term:"General Journal", def:"Records transactions that cannot be recorded in special journals"},
    {term:"Special Journal", def:"Records transactions of similar nature, such as sales or cash receipts"},
    {term:"Chart of Accounts", def:"A list of all the accounts used by a business"},
  ],
  exp:"Journals record transactions first; ledgers classify and accumulate them; the chart of accounts lists every account used."
},
{
  title:"Match each special type of account to its correct description.",
  pairs:[
    {term:"Contra account", def:"Presented in the financial statements as a deduction to its related account"},
    {term:"Adjunct account", def:"Presented in the financial statements as an addition to its related account"},
    {term:"Suspense account", def:"Used temporarily when the appropriate ledger account could not be determined"},
    {term:"Real/Permanent account", def:"Has a running balance that continually accumulates across periods"},
    {term:"Nominal/Temporary account", def:"Zeroes out at the end of each accounting period"},

},
{

  pairs:[

  ],

},
{

  pairs:[
    {term:"Step 1", def:"Identifying and analyzing transactions"},

    {term:"Step 9", def:"Making closing entries"},

  ],
  exp:"The full 11-step cycle: (1) analyze, (2) journalize, (3) post, (4) unadjusted TB, (5) worksheet, (6) adjusting entries, (7) adjusted TB, (8) financial statements, (9) closing entries, (10) post-closing TB, (11) reversing entries."
},
{

  pairs:[
    {term:"Invoice", def:"States the amount that the buyer owes the seller"},

/* ---------------------------------------------------------
   BUILD SLIDE LIST (flatten mcq + match sets, then shuffle order)
--------------------------------------------------------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

let slides = [];

function buildSlides(){
  slides = [];
  // MCQ slides, each 1 item, options shuffled
  MCQ.forEach((mcq, idx) => {
    const optIdx = shuffle(mcq.options.map((o,i)=>i));
    const newOptions = optIdx.map(i=>mcq.options[i]);
    const newCorrect = optIdx.indexOf(mcq.correct);
    slides.push({
      type:'mcq',
      question: mcq.q,
      options: newOptions,
      correct: newCorrect,
      exp: mcq.exp,
      answered:false,
      selected:null,
      itemCount:1
    });
  });
  // Match slides, each 5 items (pairs), pairs order + definitions shuffled
  MATCH_SETS.forEach(set => {
    const pairOrder = shuffle(set.pairs.map((p,i)=>i));
    const terms = pairOrder.map(i=>set.pairs[i]);
    const defsShuffled = shuffle(terms.map(t=>t.def));
    slides.push({
      type:'match',
      title: set.title,
      terms: terms.map(t=>t.term),
      correctDefs: terms.map(t=>t.def),
      defsShuffled: defsShuffled,
      selected: new Array(terms.length).fill(null),
      exp: set.exp,
      answered:false,
      itemCount: terms.length
    });
  });
  slides = shuffle(slides);
}

buildSlides();

let currentSlide = 0;
let showExp = false;

/* ---------------------------------------------------------
   SCORING
--------------------------------------------------------- */
function computeStats(){
  let correct=0, wrong=0, answered=0, total=0;
  slides.forEach(s=>{
    total += s.itemCount;
    if(s.type==='mcq'){
      if(s.answered){
        answered += 1;
        if(s.selected === s.correct) correct += 1; else wrong += 1;
      }
    } else {
      if(s.answered){
        s.selected.forEach((sel, i)=>{
          answered += 1;
          if(sel === s.correctDefs[i]) correct += 1; else wrong += 1;
        });
      }
    }
  });
  return {correct, wrong, answered, total};
}

function updateHeader(){
  const st = computeStats();
  document.getElementById('statCorrect').textContent = st.correct;
  document.getElementById('statWrong').textContent = st.wrong;
  document.getElementById('statAnswered').textContent = st.answered + '/' + st.total;
  const pct = st.total ? Math.round((st.answered/st.total)*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

/* ---------------------------------------------------------
   RENDER
--------------------------------------------------------- */
function render(){
  showExp = false;
  const slide = slides[currentSlide];
  const card = document.getElementById('cardArea');
  card.innerHTML = '';

  const meta = document.createElement('div');
  meta.className = 'qmeta';
  meta.innerHTML = `<span>${slide.type === 'mcq' ? 'Multiple Choice' : 'Matching Type'}</span><span class="pill">Slide ${currentSlide+1} / ${slides.length}</span>`;
  card.appendChild(meta);

  if(slide.type === 'mcq'){
    renderMCQ(card, slide);
  } else {
    renderMatch(card, slide);
  }

  updateHeader();
  updateNav();
}

function renderMCQ(card, slide){
  const qEl = document.createElement('div');
  qEl.className = 'question-text';
  qEl.textContent = slide.question;
  card.appendChild(qEl);

  const optsWrap = document.createElement('div');
  optsWrap.className = 'options';
  const letters = ['A','B','C','D'];

  slide.options.forEach((opt, i) => {
    const row = document.createElement('div');
    row.className = 'opt';
    row.innerHTML = `<span class="letter">${letters[i]}.</span><span>${opt}</span>`;
    if(slide.answered){
      row.classList.add('disabled');
      if(i === slide.correct) row.classList.add('correct');
      else if(i === slide.selected) row.classList.add('incorrect');
      else row.classList.add('dim');
    } else {
      row.addEventListener('click', () => {
        slide.answered = true;
        slide.selected = i;
        render();
      });
    }
    optsWrap.appendChild(row);
  });
  card.appendChild(optsWrap);

  if(slide.answered){
    const banner = document.createElement('div');
    const isCorrect = slide.selected === slide.correct;
    banner.className = 'result-banner ' + (isCorrect ? 'correct' : 'incorrect');
    banner.textContent = isCorrect ? '✓ Correct!' : '✗ Incorrect — the correct answer is highlighted above.';
    card.appendChild(banner);

    appendExplanation(card, slide.exp);
  }
}

function renderMatch(card, slide){
  const titleEl = document.createElement('div');
  titleEl.className = 'match-title';
  titleEl.textContent = slide.title;
  card.appendChild(titleEl);

  const listWrap = document.createElement('div');
  listWrap.className = 'match-list';

  slide.terms.forEach((term, i) => {
    const row = document.createElement('div');
    row.className = 'match-row';

    const termEl = document.createElement('div');
    termEl.className = 'match-term';
    termEl.textContent = term;
    row.appendChild(termEl);

    const select = document.createElement('select');
    select.className = 'match-select';
    select.disabled = slide.answered;

    const blankOpt = document.createElement('option');
    blankOpt.value = '';
    blankOpt.textContent = '— choose a match —';
    select.appendChild(blankOpt);

    slide.defsShuffled.forEach(def => {
      const o = document.createElement('option');
      o.value = def;
      o.textContent = def;
      if(slide.selected[i] === def) o.selected = true;
      select.appendChild(o);
    });

    select.addEventListener('change', (e) => {
      slide.selected[i] = e.target.value || null;
      updateSubmitState();
    });

    row.appendChild(select);

    if(slide.answered){
      const mark = document.createElement('div');
      mark.className = 'mark';
      const isCorrect = slide.selected[i] === slide.correctDefs[i];
      mark.textContent = isCorrect ? '✓' : '✗';
      row.classList.add(isCorrect ? 'correct' : 'incorrect');
      row.appendChild(mark);
    }

    listWrap.appendChild(row);
  });

  card.appendChild(listWrap);

  if(!slide.answered){
    const submitBtn = document.createElement('button');
    submitBtn.className = 'submit-btn';
    submitBtn.id = 'submitMatchBtn';
    submitBtn.textContent = 'Check Answers';
    submitBtn.disabled = slide.selected.some(s => !s);
    submitBtn.addEventListener('click', () => {
      slide.answered = true;
      render();
    });
    card.appendChild(submitBtn);
  } else {
    const correctCount = slide.selected.filter((s,i)=>s===slide.correctDefs[i]).length;
    const banner = document.createElement('div');
    const allCorrect = correctCount === slide.terms.length;
    banner.className = 'result-banner ' + (allCorrect ? 'correct' : 'incorrect');
    banner.textContent = `${correctCount} of ${slide.terms.length} matches correct.`;
    card.appendChild(banner);

    appendExplanation(card, slide.exp);
  }
}

function updateSubmitState(){
  const slide = slides[currentSlide];
  const btn = document.getElementById('submitMatchBtn');
  if(btn) btn.disabled = slide.selected.some(s => !s);
}

function appendExplanation(card, expText){
  const toggle = document.createElement('button');
  toggle.className = 'exp-toggle';
  toggle.textContent = 'Add Explanation';
  const expEl = document.createElement('div');
  expEl.className = 'explanation';
  expEl.textContent = expText;

  toggle.addEventListener('click', () => {
    showExp = !showExp;
    expEl.classList.toggle('show', showExp);
    toggle.textContent = showExp ? 'Hide Explanation' : 'Add Explanation';
  });

  card.appendChild(toggle);
  card.appendChild(expEl);
}

function updateNav(){
  document.getElementById('prevBtn').disabled = currentSlide === 0;
  document.getElementById('nextBtn').disabled = currentSlide === slides.length - 1;
  document.getElementById('slideLabel').textContent = `Slide ${currentSlide+1} / ${slides.length}`;
}

document.getElementById('prevBtn').addEventListener('click', () => {
  if(currentSlide > 0){ currentSlide--; render(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if(currentSlide < slides.length-1){ currentSlide++; render(); }
});
document.getElementById('restartBtn').addEventListener('click', () => {
  buildSlides();
  currentSlide = 0;
  render();
});

render();
</script>
