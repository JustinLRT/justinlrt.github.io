function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

  for(let i=0;i<26;i++) codes.push(String.fromCharCode(65+i));           // A - Z
  for(let i=0;i<26;i++){ const c = String.fromCharCode(65+i); codes.push(c+c); } // AA - ZZ
  ["AAA","BBB","CCC","DDD","EEE","FFF"].forEach(t=>codes.push(t));       // AAA - FFF
  return codes; // length 58
}

/* ============================================================
   STATE
============================================================ */
let folioA = { items: [], legend: [], current: 0 };
let folioB = { items: [], current: 0 };
let activeFolio = 'A';
let showExp = false;

function buildFolioA(){
  const allTexts = shuffle(FOLIO_A_RAW.map(r=>r.term).concat(FOLIO_A_DISTRACTORS));
  const codes = genLetterCodes(); // fixed order A..FFF
  const textToLetter = {};
  const legend = codes.map((code, i) => {
    textToLetter[allTexts[i]] = code;
    return { code, text: allTexts[i] };
  });

  const orderedItems = shuffle(FOLIO_A_RAW.map(r => ({
    statement: r.statement,
    term: r.term,
    exp: r.exp,
    correctLetter: textToLetter[r.term],
    selected: null,
    answered: false
  })));

  folioA = { items: orderedItems, legend, current: 0 };
}

function buildFolioB(){
  const items = shuffle(FOLIO_B_RAW).map(raw => {
    const idxOrder = shuffle(raw.options.map((o,i)=>i));
    const newOptions = idxOrder.map(i=>raw.options[i]);
    const newCorrect = idxOrder.indexOf(raw.correct);
    return {
      q: raw.q,
      options: newOptions,
      correct: newCorrect,
      exp: raw.exp,
      selected: null,
      answered: false
    };
  });
  folioB = { items, current: 0 };
}

function buildAll(){
  buildFolioA();
  buildFolioB();
}
buildAll();

/* ============================================================
   STATS
============================================================ */
function folioStats(folio){
  let correct=0, wrong=0, answered=0;
  const total = folio.items.length;
  folio.items.forEach(it=>{
    if(it.answered){
      answered++;
      const isCorrect = (activeIsA(folio)) ? (it.selected === it.correctLetter) : (it.selected === it.correct);
      if(isCorrect) correct++; else wrong++;
    }
  });
  return { correct, wrong, answered, total };
}
function activeIsA(folio){ return folio === folioA; }

function updateHeader(){
  const folio = activeFolio === 'A' ? folioA : folioB;
  const st = folioStats(folio);
  document.getElementById('headerTitle').textContent = activeFolio === 'A' ? 'Folio A — Matching Type' : 'Folio B — Multiple Choice';
  document.getElementById('statCorrect').textContent = st.correct;
  document.getElementById('statWrong').textContent = st.wrong;
  document.getElementById('statAnswered').textContent = st.answered + '/' + st.total;
  const pct = st.total ? Math.round((st.answered/st.total)*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';

  const stA = folioStats(folioA);
  const stB = folioStats(folioB);
  document.getElementById('combinedNote').textContent =
    'Combined total: ' + (stA.answered+stB.answered) + '/100 answered · ' +
    (stA.correct+stB.correct) + ' correct · ' + (stA.wrong+stB.wrong) + ' wrong';
}

/* ============================================================
   RENDER — FOLIO A (Matching)
============================================================ */
function renderFolioA(){
  const card = document.getElementById('cardArea');
  card.innerHTML = '';
  const it = folioA.items[folioA.current];

  const meta = document.createElement('div');
  meta.className = 'qmeta';
  meta.innerHTML = `<span>Matching Type</span><span class="pill">Item ${folioA.current+1} / ${folioA.items.length}</span>`;
  card.appendChild(meta);

  const qEl = document.createElement('div');
  qEl.className = 'question-text';
  qEl.textContent = it.statement;
  card.appendChild(qEl);

  const row = document.createElement('div');
  row.className = 'match-select-row';
  const select = document.createElement('select');
  select.className = 'big-select';
  select.disabled = it.answered;

  const blank = document.createElement('option');
  blank.value = '';
  blank.textContent = '— choose a letter —';
  select.appendChild(blank);

  folioA.legend.forEach(entry => {
    const o = document.createElement('option');
    o.value = entry.code;
    o.textContent = entry.code;
    if(it.selected === entry.code) o.selected = true;
    select.appendChild(o);
  });

  select.addEventListener('change', (e) => {
    if(!e.target.value) return;
    it.selected = e.target.value;
    it.answered = true;
    render();
  });

  row.appendChild(select);
  card.appendChild(row);

  if(it.answered){
    const isCorrect = it.selected === it.correctLetter;
    const banner = document.createElement('div');
    banner.className = 'result-banner ' + (isCorrect ? 'correct' : 'incorrect');
    banner.textContent = isCorrect ? '✓ Correct!' : '✗ Incorrect.';
    card.appendChild(banner);

    const correctLine = document.createElement('div');
    correctLine.className = 'correct-match-line';
    correctLine.textContent = `Correct match: ${it.correctLetter} — ${it.term}`;
    card.appendChild(correctLine);

    appendExplanation(card, it.exp);
  }

  renderLegend();
}

function renderLegend(){
  const legendArea = document.getElementById('legendArea');
  if(activeFolio !== 'A'){ legendArea.innerHTML = ''; return; }
  legendArea.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'legend-wrap';
  wrap.innerHTML = `
    <div class="legend-title">Full Choice Bank (A – FFF)</div>
    <div class="legend-sub">58 lettered choices for 50 items — refer here for the exact wording of every choice.</div>
  `;
  const grid = document.createElement('div');
  grid.className = 'legend-grid';
  folioA.legend.forEach(entry=>{
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<b>${entry.code}.</b><span>${entry.text}</span>`;
    grid.appendChild(item);
  });
  wrap.appendChild(grid);
  legendArea.appendChild(wrap);
}

/* ============================================================
   RENDER — FOLIO B (MCQ)
============================================================ */
function renderFolioB(){
  document.getElementById('legendArea').innerHTML = '';
  const card = document.getElementById('cardArea');
  card.innerHTML = '';
  const it = folioB.items[folioB.current];

  const meta = document.createElement('div');
  meta.className = 'qmeta';
  meta.innerHTML = `<span>Multiple Choice</span><span class="pill">Item ${folioB.current+1} / ${folioB.items.length}</span>`;
  card.appendChild(meta);

  const qEl = document.createElement('div');
  qEl.className = 'question-text';
  qEl.textContent = it.q;
  card.appendChild(qEl);

  const optsWrap = document.createElement('div');
  optsWrap.className = 'options';
  const letters = ['A','B','C','D'];

  it.options.forEach((opt, i) => {
    const row = document.createElement('div');
    row.className = 'opt';
    row.innerHTML = `<span class="letter">${letters[i]}.</span><span>${opt}</span>`;
    if(it.answered){
      row.classList.add('disabled');
      if(i === it.correct) row.classList.add('correct');
      else if(i === it.selected) row.classList.add('incorrect');
      else row.classList.add('dim');
    } else {
      row.addEventListener('click', () => {
        it.answered = true;
        it.selected = i;
        render();
      });
    }
    optsWrap.appendChild(row);
  });
  card.appendChild(optsWrap);

  if(it.answered){
    const isCorrect = it.selected === it.correct;
    const banner = document.createElement('div');
    banner.className = 'result-banner ' + (isCorrect ? 'correct' : 'incorrect');
    banner.textContent = isCorrect ? '✓ Correct!' : '✗ Incorrect — the correct answer is highlighted above.';
    card.appendChild(banner);

    appendExplanation(card, it.exp);
  }
}

function appendExplanation(card, expText){
  showExp = false;
  const toggle = document.createElement('button');
  toggle.className = 'exp-toggle';
  toggle.textContent = 'Add Explanation';
  const expEl = document.createElement('div');
  expEl.className = 'explanation';
  expEl.textContent = expText;

  toggle.addEventListener('click', () => {
    showExp = !showExp;
    expEl.classList.toggle('show', showExp);
    toggle.textContent = showExp ? 'Hide Explanation' : 'Add Explanation';
  });

  card.appendChild(toggle);
  card.appendChild(expEl);
}

/* ============================================================
   MAIN RENDER + NAV
============================================================ */
function render(){
  if(activeFolio === 'A') renderFolioA(); else renderFolioB();
  updateHeader();
  updateNav();
}

function updateNav(){
  const folio = activeFolio === 'A' ? folioA : folioB;
  document.getElementById('prevBtn').disabled = folio.current === 0;
  document.getElementById('nextBtn').disabled = folio.current === folio.items.length - 1;
  document.getElementById('slideLabel').textContent = `Item ${folio.current+1} / ${folio.items.length}`;
}

document.getElementById('prevBtn').addEventListener('click', () => {
  const folio = activeFolio === 'A' ? folioA : folioB;
  if(folio.current > 0){ folio.current--; render(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  const folio = activeFolio === 'A' ? folioA : folioB;
  if(folio.current < folio.items.length-1){ folio.current++; render(); }
});

document.getElementById('tabA').addEventListener('click', () => {
  activeFolio = 'A';
  document.getElementById('tabA').classList.add('active');
  document.getElementById('tabB').classList.remove('active');
  render();
});
document.getElementById('tabB').addEventListener('click', () => {
  activeFolio = 'B';
  document.getElementById('tabB').classList.add('active');
  document.getElementById('tabA').classList.remove('active');
  render();
});

document.getElementById('restartBtn').addEventListener('click', () => {
  buildAll();
  render();
});

render();
</script>
</body>
</html>
